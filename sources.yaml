images:
  enabled: true
  max_per_edition: 4
  max_width: 1200
  max_bytes: 2500000
collection:
  max_items_per_source: 35
  max_news_age_days: 3
  max_http_requests: 260
  max_download_bytes: 100000000
  max_seconds: 1800 # A whole edition may run for at most 30 minutes.
  max_cache_bytes: 25000000 # Keep Render memory bounded even with a larger download budget.
  max_candidate_previews: 45 # Better editorial judgement without another AI call.
  candidate_preview_budget_fraction: 0.6 # Keep at least 40% for selected articles and images.
  max_readability_checks: 65 # Extract before selection, then reuse the full text in the EPUB.
  readability_budget_fraction: 0.8 # Leave at least 20% of the HTTP/byte budget for images and delivery.
ai:
  model: gpt-5-mini
  # gpt-5-mini remains the inexpensive editor. Web search needs a model that
  # supports the built-in web tool, so keep that capability separate.
  web_search_model: gpt-5.6-luna
  # A firm cost ceiling. Collection may be broad, but paid editorial context is
  # trimmed before it can grow beyond this budget.
  max_prompt_characters: 90000
  search_output_tokens: 2200
  selection_output_tokens: 10000 # A ceiling, not a target; prevents valid 22-story editions being truncated.
  selection_timeout_seconds: 180 # Long enough for the larger structured response on a cold model call.
