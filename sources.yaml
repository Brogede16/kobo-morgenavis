# Edit this file and commit the changes: it is the editorial source of truth.
edition:
  title: "Mads Morgen"
  language: da
  max_articles: 10
  max_candidates: 180 # Broad collection; the model only sees the shortlisted items below.
  ai_shortlist_size: 80
  max_summary_characters: 260
  max_articles_per_source: 2
  timezone: Europe/Copenhagen
  schedule: "30 5 * * *" # 05:30 every day, in the timezone above
  topics:
    - Danmark
    - dansk politik
    - politik
    - økonomi
    - samfund
    - verden
    - teknologi
    - videnskab
    - kultur
    - museer
    - spil
    - fotografi
web_search:
  # Gemini Google Search grounding runs in the scheduled edition.
  enabled_for_schedule: true
  max_queries: 5
  queries:
    - "vigtige nyheder i dag Danmark verden teknologi videnskab"
    - "Apple Mac AI modeller nye features produkt leaks nyheder i dag"
    - "dansk film kulturpolitik Det Danske Filminstitut -site:dfi.dk Esben Danielsen analyser"
    - "dansk politik reformer økonomi samfund væsentlige analyser nyheder"
    - "museer kulturinstitutioner publikum data brand partnerships biografer AI kultur aktuelle analyser"
source_limits:
  MacRumors: 1
  TechCrunch: 2
  The Guardian Technology: 2
  Ars Technica: 2
  WIRED: 2
images:
  enabled: true
  max_per_article: 1
  max_width: 1200
  max_bytes: 2500000
collection:
  max_items_per_source: 25
sources:
  - name: DR Nyheder
    url: https://www.dr.dk/nyheder/service/feeds/senestenyt
    enabled: true
    format: short
  - name: The Guardian World
    url: https://www.theguardian.com/world/rss
    enabled: true
    format: mixed
  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    enabled: true
    format: short
  - name: BBC Technology
    url: https://feeds.bbci.co.uk/news/technology/rss.xml
    enabled: true
    format: short
  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    enabled: true
    format: mixed
  - name: WIRED
    url: https://www.wired.com/feed/rss
    enabled: true
    format: mixed
  - name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
    enabled: true
    format: longread
  - name: The Guardian Technology
    url: https://www.theguardian.com/uk/technology/rss
    enabled: true
    format: mixed
  - name: The Conversation
    url: https://theconversation.com/global/articles.atom
    enabled: true
    format: longread
  - name: MacRumors
    url: https://www.macrumors.com/macrumors.xml
    enabled: true
    format: mixed
  - name: TechCrunch
    url: https://techcrunch.com/feed/
    enabled: true
    format: mixed
