# Edit this file and commit the changes: it is the editorial source of truth.
edition:
  title: "Mads Morgen"
  language: da
  max_articles: 8
  max_candidates: 40
  max_summary_characters: 320
  timezone: Europe/Copenhagen
  schedule: "30 5 * * *" # 05:30 every day, in the timezone above
  topics:
    - Danmark
    - verden
    - teknologi
    - videnskab
    - kultur
web_search:
  # Web search uses a separate OpenAI web-search tool call. Keep it off in the
  # scheduled edition unless it proves valuable enough to justify its cost.
  enabled_for_schedule: false
  max_queries: 2
  queries:
    - "vigtige nyheder i dag Danmark verden teknologi videnskab"
    - "positive eller væsentlige kulturhistorier i dag"
sources:
  - name: DR Nyheder
    url: https://www.dr.dk/nyheder/service/feeds/senestenyt
    enabled: true
  - name: The Guardian World
    url: https://www.theguardian.com/world/rss
    enabled: true
