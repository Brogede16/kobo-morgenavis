# Edit this file and commit the changes: it is the editorial source of truth.
edition:
  title: "Mads Morgen"
  language: da
  max_articles: 22
  max_backups: 10 # Preflighted full-text reserves; no need to pay for a large blind fallback pool.
  max_candidates: 360 # Broad collection; the model only sees the shortlisted items below.
  web_candidate_reserve: 55 # Prevent RSS volume from crowding out news-radar and web results.
  ai_shortlist_size: 75 # Fits the prompt budget instead of being silently trimmed.
  max_summary_characters: 400 # More context per article while keeping token use controlled.
  max_articles_per_source: 3
  minimum_articles: 8 # Deliver a useful edition when publishers block article extraction.
  history_editions: 3 # Skip stories the last three editions already carried.
  timezone: Europe/Copenhagen
  schedule: "30 5 * * *" # 05:30 every day, in the timezone above
  topics:
    - Danmark
    - dansk politik
    - politik
    - økonomi
    - samfund
    - verden
    - teknologi
    - videnskab
    - kultur
    - museer
    - spil
    - fotografi
curation:
  # Local shortlist hints only, never hard exclusions or final editorial quotas.
  # One fifth of the shortlist remains available for broad discovery.
  interest_signals:
    dansk_politik: [regeringen, finanslov, reform, forlig, minister, folketing, kommune, velfærd, dansk politik, danish politics]
    kultur: [kulturpolitik, kulturstøtte, museum, museer, publikum, publikumsudvikling, biograf, filmstøtte, festival, sponsorater, audience development, cultural policy]
    teknologi: [AI, kunstig intelligens, agents, agenter, apple, mac, iphone, kobo, e-ink, automatisering, vibe coding, wearables]
    verden: [ukraine, rusland, russia, NATO, forsvar, europæisk sikkerhed, defence, geopolitics]
    interesser: [planet zoo, warcraft, age of empires, survival, astronomi, astronomy, cosmology, kosmologi, arkæologi, archaeology, bunkere, tunnels, københavn, copenhagen, fotografi, photography, the cure, new order, kraftwerk, pink floyd]
web_search:
  # OpenAI web search runs in the scheduled edition.
  enabled_for_schedule: true
  rotating_queries_per_day: 3 # Four core searches plus three rotating specialist searches.
  feed_leads: 20 # Turn strong RSS/paywall headlines into searches for readable independent coverage.
  queries:
    - "vigtige nyheder i dag Danmark verden teknologi videnskab"
    - "Apple Mac AI modeller nye features produkt leaks nyheder i dag"
    - "dansk film kulturpolitik Det Danske Filminstitut -site:dfi.dk Esben Danielsen analyser"
    - "dansk politik reformer økonomi samfund væsentlige analyser nyheder"
    - "Rusland Ukraine krig NATO europæisk sikkerhed dansk forsvar energi økonomi konsekvenser analyse nyheder"
    - "museer kulturinstitutioner publikum data brand partnerships biografer AI kultur aktuelle analyser"
    - "site:dr.dk/kultur dansk kulturpolitik store kulturelle begivenheder udstillinger koncerter film aktuelle nyheder"
    - "Warcraft Age of Empires Planet Zoo GTA survival games major announcement sequel expansion release date news"
    - "AI agents autonomous work practical implications vibe coding solo builders AI assisted coding interesting new AI architecture startup"
    - "astronomy cosmology dark matter dark energy new telescope universe map archaeology major science discovery interactive data map"
    - "bunkers tunnels archives datacentres infrastructure hidden systems how things work new investigation"
    - "photography learning beginner tutorial site:magnumphotos.com OR site:canon-europe.com OR site:nikon.com OR site:adobe.com OR site:rps.org"
    - "Kobo e-ink smart home automation sensors Raspberry Pi personal technology interesting internet project map database"
    - "The Cure New Order Pink Floyd Kraftwerk new album major tour reunion subculture shoegaze clubs music scene"
    - "Copenhagen new public space culture building metro harbour climate adaptation tourism museum cinema festival hospitality retail event production cultural pricing youth board"
    - "major cyber attack explained USB JPEG Bluetooth QR code standard cinema laser IMAX 70mm HDR AI generated game prototype management game"
    - "animal cognition octopus crow raven whale elephant geoengineering Dyson sphere astronomical anomaly Denmark critical infrastructure bunker tunnel metro utilities"
    - "site:politiken.dk/politik OR site:information.dk Danmark politik reform lovforslag minister konflikt analyse OR site:kulturmonitor.dk kulturpolitik"
    - "site:altinget.dk dansk politik forlig lovforslag reform kommune region analyse OR site:zetland.dk dansk samfund politik"
alternative_coverage:
  # Preferred open destinations when a radar source identifies a strong story.
  # These are hints for the existing bounded web-search call, not extra searches.
  dansk_politik: [dr.dk, nyheder.tv2.dk, videnskab.dk, kosmopol.tv2reg.digital]
  verden_og_sikkerhed: [theguardian.com, bbc.com, bbc.co.uk]
