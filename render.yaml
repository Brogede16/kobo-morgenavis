services:
  - type: web
    name: kobo-morgenavis
    runtime: python
    plan: starter # An always-on instance is required for the internal scheduler.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: RUN_NOW_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
