services:
  - type: web
    name: kobo-morgenavis
    runtime: python
    plan: starter # An always-on instance is required for the internal scheduler.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: RUN_NOW_TOKEN
        generateValue: true
      - key: ADMIN_USERNAME
        value: mads
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: GITHUB_REPOSITORY
        value: Brogede16/kobo-morgenavis
      - key: GITHUB_FEEDBACK_BRANCH
        value: feedback-data
      - key: GITHUB_FEEDBACK_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
