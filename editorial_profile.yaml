# This is the durable editorial brief. It is versioned in Git and updated when
# Mads gives feedback in this conversation. Keep examples concise and useful.
editorial:
  voice: "Danish morning briefing: intelligent, calm, useful, never clickbait. The reader should feel prepared for the day and ahead of the conversations that matter."
  desired_mix:
    short_updates: "12-15 concise but properly explained updates that matter today"
    longreads: "6-8 substantive analyses, explainers, investigations, or deep-interest stories"
    breadth: "Keep the core balance: Denmark/world, AI and technology, science, politics, culture, and selected personal interests. A stronger culture section must never crowd out the other core areas."
    political_floor: "When the news day permits, include 1-2 concrete Danish political or public-policy stories: a decision, proposal, conflict, budget, regulation, or consequence — not merely a ceremonial appearance or a media roundup."
  daily_structure:
    - "2 concrete Danish politics, public-policy, economy, or society stories when the day supports it"
    - "1 world or geopolitics story with a clear Danish or European consequence"
    - "1 AI, technology, Apple, or personal-technology story that changes real use or understanding"
    - "1 Danish culture, culture-policy, or major cultural event/release with genuine Danish relevance"
    - "1 personal high-interest story when there is a truly meaningful development"
    - "6-8 varied discoveries or longreads: science, city, systems, culture operations, history, or subculture"
  priority_tiers:
    daily_core:
      - Danish politics, public policy, economy, society, and culture policy
      - world politics and geopolitics with Danish or European consequences
      - AI, technology, Apple/Mac, and practical personal technology
      - Danish film, culture, cultural institutions, and major culture in a Danish context
    rotation:
      - audience development, culture operations, Copenhagen, infrastructure, science, history, and internet culture
      - space, cosmology, animal cognition, cyber security, standards, and how systems work
    personal_spikes:
      - Planet Zoo, major strategy/management/survival games, selected bands, photography learning, Kobo/e-ink, and nerd-built projects
  priorities:
    - Denmark and the world
    - technology, science, culture, and ideas
    - Danish politics, public policy, economics, and society
    - international politics and geopolitics when it explains consequences
    - significance over novelty
    - Apple/Mac, AI models, meaningful new AI features, and credible product leaks
    - Danish film, film policy, culture analysis, and Esben Danielsen's public analysis
    - "Danish politics and culture policy: the decisions, institutions, budgets, people, and conflicts that shape cultural life in Denmark"
    - "major physical cultural events and releases viewed in a Danish context: exhibitions, concerts, festivals, films, books, and international artists that genuinely matter here"
    - museum development, younger audiences, visitor data, cultural participation, and the changing economics of cinemas
    - cultural institutions' brand partnerships and sponsorship, especially when the story examines independence, audience value, or the trade-off involved
    - practical AI in cultural institutions and other real-world work, rather than vague futurism
    - "concrete audience development: methods, cases, young audiences, behaviour, segmentation, CRM, visitor surveys, and how insight changes programming or the guest experience"
    - cultural institutions that try new formats, hours, events, memberships, services, and alternative revenue models
    - "practical cultural technology: ticketing, automation, APIs, data, and digital experiences with a clear application"
    - AI agents and the consequences of AI acting more independently; what new capabilities practically enable, rather than version-number coverage
    - vibe coding, solo builders, AI-assisted software, small apps, automations, and people building without a conventional developer background
    - unusual, forward-looking AI ideas, architectures, research groups, or startups when the underlying idea is genuinely compelling
    - astronomy and space science when there is a substantial discovery, dataset, or new way to understand the universe
    - cosmology and accessible science journalism about dark matter, dark energy, extra dimensions, and other big questions
    - major discoveries in biology, evolution, archaeology, geology, oceans, climate, and human history
    - interactive maps, visualisations, public datasets, and projects the reader can explore firsthand
    - "hidden places and systems: bunkers, tunnels, archives, datacentres, infrastructure, underground sites, and normally inaccessible systems"
    - historical mysteries and new discoveries that revise what we thought we knew
    - "Copenhagen in transformation: substantial new public spaces, cultural buildings, metro, harbour, climate adaptation, tourism, and major city projects"
    - "how large cultural institutions work behind the scenes: museums, cinemas, festivals, and venues as organisations"
    - "hospitality in culture: the practical choices that make a venue feel generous, welcoming, and worth visiting before the programme begins"
    - "museum and cultural retail: shops, books, merch, limited editions, and retail as part of the visitor experience"
    - "programme curation in film, music, talks, and art: how a coherent, compelling series is put together"
    - cultural trends before they become mainstream, including internet aesthetics across TikTok, Tumblr, Pinterest, gaming, fashion, and music
    - animal cognition, especially meaningful research on octopuses, corvids, whales, elephants, and other unusually intelligent animals
    - serious investigations of astronomical anomalies and megastructures, including Dyson-sphere-like ideas when researchers are doing real work
    - geoengineering, including both potential and the difficult risks and governance questions
    - "cybersecurity for normal people: major hacks and clever attacks explained through their actual consequences"
    - standards and mundane systems that shape daily life, such as USB, JPEG, Bluetooth, QR codes, and media/container formats
    - "cinema technology when a development is significant and perceptible: projection, laser, sound, screens, IMAX, 70mm, and HDR"
    - "cultural institutions' secondary revenue: hire, events, restaurant, retail, rooftops, sponsorship, and membership"
    - unusual events in unusual places and the production logic that makes them possible
    - "event production behind the scenes: logistics, technical production, security, guest flow, and operational software — primarily as useful longreads"
    - cultural pricing, value perception, access, membership, and the trade-off between ticket price and participation
    - young people as genuine co-creators through youth boards, academies, open calls, and real decision-making power
    - "Copenhagen cultural history and lost places: cinemas, clubs, venues, museums, and scenes that no longer exist"
    - "Denmark below ground and its critical infrastructure: tunnels, bunkers, utilities, sewerage, metro, basements, electricity, internet, water, and transport resilience"
    - "AI-generated games and prototypes: how far a single person can go from an idea to a working management/strategy game"
    - meaningful wearable launches, features, and health/technology developments
    - major gaming news for Age of Empires, Warcraft, survival games, 7 Days to Die, and GTA — only launches, major expansions, or genuinely consequential changes
    - "Planet Zoo as a personal deep-interest: major news, a sequel, expansion, or substantial change deserves more context than ordinary game coverage"
    - beginner-to-intermediate photography learning from established, credible educators or institutions — learning, not product news
    - "personal technology that changes everyday use: Kobo/e-ink, automation, sensors, smart home, and purposeful devices"
    - "nerd-built internet projects: personal newspapers, maps, Raspberry Pi builds, unusual databases, and ambitious individual projects"
    - "major news about The Cure, New Order, Pink Floyd, and Kraftwerk: albums, significant tours, reunions, breakups, or substantial interviews"
    - subcultures, especially the emergence or revival of scenes, music, fashion, clubs, and communities
    - culture and film gossip when it reveals power, money, conflict, ownership, or creative direction
  exclusions:
    - podcast launches
    - sponsored content, advertorials, giveaways, and affiliate shopping
    - trivial rumours, isolated technical specifications, and repetitive live-blog updates
    - generic “top stories” roundups as reading items
    - reviews of non-Apple hardware unless the wider technology angle is exceptional
    - minor game patches, routine seasonal updates, and low-consequence gaming rumours
    - generic photography gear shopping, unverified tutorials, and low-quality creator content
    - Apple and gadget rumours that merely change a specification, not what the product enables or how it is used
    - routine band-podcast mentions and minor celebrity/social updates
    - generic foreign accidents, death-toll updates, fires, crime, and disaster-wire stories without a clear Danish or European policy, security, or economic consequence
    - NGO campaigns, charity-fund announcements, and global health or human-rights initiatives written in institutional jargon, unless the consequence is unusually concrete and directly relevant
  source_policy: "Judge each story on its own merits; a good and a bad story can come from the same domain. No single source should dominate an edition, but diversity is never a reason to skip the best story: repeat a trusted core source when it genuinely has the strongest article that day. Use specialist outlets as one voice among several."
  source_roles: "Politiken, Information, Kulturmonitor, and Altinget are editorial radar, not automatic reading links. DR and independent reporting can be direct reading sources. Official bodies such as Folketinget are background or primary documentation, never the main reading item when journalistic reporting is available."
  paywall_policy: "Politiken, Information, and Kulturmonitor may be used as signals for a topic, angle, or story worth investigating. Do not select inaccessible paywalled copy as a reading item; seek an original, accessible, or independently reported source instead."
  film_policy: "Cover news about the Danish Film Institute through independent reporting, policy, funding, films, and industry impact — not the institute's own press releases or event promotion."
  culture_policy: "Prefer concrete cases and useful analysis over abstract cultural theory. A concise, practical piece about how an institution reaches younger audiences can beat a longer, more ponderous feature on the same subject. Institutional press releases may be a lead, but need independent context before they become a reading item. Cover big cultural events and releases when they have real Danish relevance — for example a major international artist, exhibition, film, or cultural moment — but not routine domestic pop-release promotion. DR Kultur is a useful source alongside independent coverage."
  daily_readiness_test: "Every selected story should earn its place by helping the reader understand what matters today, anticipate a likely conversation, or gain useful context. Maintain a clear Danish frame while including international developments with consequences or resonance in Denmark. This is not a general world-news wire: a foreign tragedy alone is not enough."
  photography_source_policy: "For photography learning, prefer Magnum Learn, Canon Learning/Canon Europe, Nikon Learn, Adobe Photography, Digital Photography Review when it teaches, National Geographic photographers, established professional photographers, Royal Photographic Society, and selectively PetaPixel tutorials or interviews. Do not select camera shopping or ordinary gear-release coverage."
  gaming_policy: "This is not a gaming-news feed. Select only major, playable news: a new game, sequel, release, large expansion, major roadmap, fundamental gameplay change, or a surprising new project from a relevant studio. Prioritise Age of Empires, Warcraft, 7 Days to Die, survival, management, builders, strategy, Planet Zoo/Planet Coaster-like games, Manor Lords-like games, and genuinely breakout new titles in those genres."
  place_and_systems_policy: "These stories should be selected for substance: a meaningful project, real operational insight, strong case study, or a concrete consequence. Treat event-production, hospitality, pricing, infrastructure, and institutional-business stories as longread-friendly rather than daily filler."
  readability_policy: "Do not select institutional press releases, official news roundups, or technically dense research announcements as the main reading item when a clearer journalistic explainer is available. A science story must explain the surprising question, what changed, and why it matters in ordinary Danish; primary sources may support the summary but should not become homework."
  sexuality_policy: "Sexuality, intimacy, and erotic culture are neither excluded nor automatically promoted. Select them on the same demanding standard as everything else when the reporting is genuinely interesting, insightful, culturally relevant, or surprising — never merely for titillation."
